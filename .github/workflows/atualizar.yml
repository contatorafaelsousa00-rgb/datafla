# Coleta diária dos dados e publicação do site no Firebase Hosting.
# Segredos (Settings > Secrets and variables > Actions):
#   API_FOOTBALL_KEY          chave da API-Football (obrigatório para coletar)
#   FIREBASE_SERVICE_ACCOUNT  JSON da conta de serviço do Firebase (opcional; sem ele não publica)
# Variável (aba Variables):
#   FIREBASE_PROJECT_ID       ID do projeto no Firebase
name: Atualizar dados

on:
  schedule:
    - cron: "17 10 * * *"   # todo dia, 07:17 em Brasília
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atualizar
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    env:
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      TEM_FIREBASE: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Testes
        run: python -m pytest -q

      - name: Coletar e processar
        if: env.API_FOOTBALL_KEY != ''
        run: python -m coleta.coletar tudo

      - name: Salvar dados no repositório
        if: env.API_FOOTBALL_KEY != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/csv data/validacao site/dados
          git diff --cached --quiet || git commit -m "Atualiza dados ($(date -u +%Y-%m-%d))"
          git push

      - name: Publicar no Firebase
        if: env.TEM_FIREBASE == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ vars.FIREBASE_PROJECT_ID }}
          channelId: live
