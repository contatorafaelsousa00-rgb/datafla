# Coleta da temporada atual e publicação do site no Firebase Hosting.
#
# Quando roda:
#   - a cada 30 min, disparado de fora (cron-job.org → API do GitHub, "workflow_dispatch"), no horário exato;
#   - 00:17 e 07:17 (Brasília) pelo agendador do GitHub, como reserva (ele costuma atrasar);
#   - em push no painel ou na coleta (site/, coleta/, firebase.json): gera os dados e publica, sem usar a API.
# Só as respostas brutas da Highlightly, as fotos e os logos ficam no Git; o JSON do site e os CSVs são
# gerados a cada publicação por `coletar processar` (não gasta cota), para o repositório não inchar.
# Cada execução agendada primeiro decide, sem gastar cota da API, se há algo para coletar
# (`coletar planejar`: jogo que acabou há pouco, ou atualização diária 24 h após a última coleta).
# Se não houver, termina em segundos sem coletar nem publicar.
#
# Temporadas passadas: rode localmente `python -m coleta.coletar tudo --fonte api-football --temporada 2024`.
# Segredos (Settings > Secrets and variables > Actions):
#   HIGHLIGHTLY_KEY           chave da Highlightly (fonte da temporada atual; obrigatório para coletar)
#   API_FOOTBALL_KEY          chave da API-Football (opcional: fotos dos jogadores, 1 req/semana)
#   FIREBASE_SERVICE_ACCOUNT  JSON da conta de serviço do Firebase (sem ele não publica)
# Variável (aba Variables):
#   FIREBASE_PROJECT_ID       ID do projeto no Firebase
name: Atualizar dados

on:
  schedule:
    - cron: "17 3 * * *"    # 00:17 em Brasília (reserva do disparo externo)
    - cron: "17 10 * * *"   # 07:17 em Brasília (reserva do disparo externo)
  workflow_dispatch:
    inputs:
      forcar:
        description: "Coletar mesmo sem novidade"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["site/**", "coleta/**", "firebase.json", ".github/workflows/atualizar.yml"]

permissions:
  contents: write
  issues: write  # aviso de falha (abre/fecha issue)

concurrency:
  group: atualizar
  cancel-in-progress: false

jobs:
  atualizar:
    # Fixo no 24.04 (o ubuntu-latest virou Ubuntu 26 em 19/10/2026): imagem previsível.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      HIGHLIGHTLY_KEY: ${{ secrets.HIGHLIGHTLY_KEY }}
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      TEM_FIREBASE: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4  # Node fixo para o firebase-tools do deploy (não depender do que vem na imagem)
        with:
          node-version: "22"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Decidir se coleta
        id: plano
        if: github.event_name != 'push' && env.HIGHLIGHTLY_KEY != ''
        run: python -m coleta.coletar planejar ${{ inputs.forcar && '--forcar' || '' }}

      - name: Testes
        if: github.event_name == 'push' || steps.plano.outputs.coletar == 'true'
        run: python -m pytest -q

      - name: Coletar e processar
        if: steps.plano.outputs.coletar == 'true'
        env:
          FLA_MOTIVO: ${{ steps.plano.outputs.motivo }}
        run: python -m coleta.coletar tudo --fonte highlightly

      - name: Gerar dados do site
        # Todas as temporadas com dados (não só o ano do relógio): sem isso, no 1º deploy de janeiro a temporada
        # anterior sumiria do site, porque site/dados não fica no Git e é gerado do zero a cada publicação.
        if: github.event_name == 'push' || steps.plano.outputs.coletar == 'true'
        run: python -m coleta.coletar processar --fonte highlightly --todas

      - name: Salvar dados no repositório
        if: steps.plano.outputs.coletar == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # As respostas da Highlightly ficam no Git: a próxima execução não baixa de novo os jogos
          # já coletados (100 requisições por dia, 2 por jogo) e o site nunca sai com dados parciais.
          git add data/*/raw-highlightly data/*/atualizacoes.json site/fotos site/logos
          git diff --cached --quiet || git commit -m "Atualiza dados ($(date -u +%Y-%m-%d\ %H:%M) UTC)"
          git pull --rebase --autostash
          git push

      - name: Testar o painel
        # abre cada aba num Chrome sem janela; erro de JavaScript ou aba vazia barra a publicação
        if: env.TEM_FIREBASE == 'true' && (github.event_name == 'push' || steps.plano.outputs.coletar == 'true')
        run: python scripts/teste_painel.py

      - name: Testes de front-end
        # Playwright com o Chrome do ubuntu-latest: telas, filtros, contraste, celular, mata-mata, imagem exportada
        if: env.TEM_FIREBASE == 'true' && (github.event_name == 'push' || steps.plano.outputs.coletar == 'true')
        run: python -m pytest tests/front -q

      - name: Publicar no Firebase
        if: env.TEM_FIREBASE == 'true' && (github.event_name == 'push' || steps.plano.outputs.coletar == 'true')
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ vars.FIREBASE_PROJECT_ID }}
          channelId: live
          # firebase-tools mais novo (padrão da action). A 15.34.1 (21/10/2026) passou a checar se a API do Hosting está
          # ativa: a conta de serviço do deploy precisou do papel "Service Usage Consumer" (dado em 28/10/2026).

      # ---- Aviso de falha: a 1ª falha abre uma issue (GitHub avisa por e-mail e no app); enquanto ela estiver aberta,
      # as seguintes não abrem outra (sem enxurrada a cada 15 min). Fecha sozinha quando uma publicação volta a funcionar.
      # Motivo: o deploy ficou quebrado de 22 a 27/10/2026 sem ninguém saber.
      - name: Avisar falha
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          execucao="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          aberta=$(gh issue list --label falha-automatica --state open --json number --jq '.[0].number')
          if [ -z "$aberta" ]; then
            gh label create falha-automatica --color B60205 --description "Aberta pelo workflow quando a atualização falha" --force
            gh issue create --label falha-automatica --title "Atualização do datafla falhou" --body "A execução do workflow falhou: $execucao

          Enquanto esta issue estiver aberta, novas falhas não abrem outra. Ela fecha sozinha quando uma publicação voltar a dar certo. O admin do site (Coleta) também lista as execuções."
          fi

      - name: Fechar aviso de falha
        if: success() && (github.event_name == 'push' || steps.plano.outputs.coletar == 'true')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          execucao="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          for n in $(gh issue list --label falha-automatica --state open --json number --jq '.[].number'); do
            gh issue close "$n" --comment "Voltou a funcionar: $execucao"
          done
